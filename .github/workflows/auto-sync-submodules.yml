name: Sync canonical application reference
on:
  repository_dispatch:
    types: [edition-updated]
  workflow_dispatch:
    inputs:
      edition:
        description: Canonical edition only (claude); other values are skipped
        required: true
        default: claude
        type: string
permissions:
  contents: write
concurrency:
  group: canonical-reference-sync
  cancel-in-progress: false
jobs:
  sync-submodule:
    if: ${{ (github.event_name == 'repository_dispatch' && github.event.client_payload.edition == 'claude') || (github.event_name == 'workflow_dispatch' && github.event.inputs.edition == 'claude') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Update only the canonical gitlink
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init -- versions/claude
          git -C versions/claude fetch origin main
          git -C versions/claude checkout --detach origin/main
          python3 scripts/check-reference-integrity.py
          if git diff --quiet HEAD -- versions/claude; then
            echo 'Canonical reference already current'
            exit 0
          fi
          git add versions/claude
          git commit -m 'chore: advance canonical application reference'
          git push origin main
