name: Weekly reference integrity
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-reference-integrity
  cancel-in-progress: true
jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify snapshot pins and convergence policy
        run: python3 scripts/check-reference-integrity.py
      - name: Test convergence guards
        run: python3 -m unittest discover -s scripts/tests -v
