name: Convergence integrity
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check-reference-integrity.py
      - run: python3 -m unittest discover -s scripts/tests -v
